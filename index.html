<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b1e1e"><title>Controle GCIF — Base Florestal Oeste</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div><small>OPERAÇÃO FLORESTAL • CBMBA</small><h1>Controle GCIF</h1><p>Base Florestal Oeste — Barreiras</p></div><button id="share">Compartilhar</button></header>
<main>
<section id="adminBar" class="adminBar"><span id="authStatus">Visualização pública</span><button id="loginBtn">Entrar como administrador</button><button id="logoutBtn" hidden>Sair</button></section>
<section id="summary" class="summary"></section>
<section class="toolbar"><input id="search" placeholder="Buscar GCIF, militar, cidade ou viatura"><select id="filter"><option value="TODOS">Todos os status</option><option>COMBATE</option><option>MONITORAMENTO</option><option>PRONTIDÃO</option><option>BASE</option></select></section>
<section class="legend"><span>🔥 Combate</span><span>M Monitoramento</span><span>PRT Prontidão</span><span>● Base/Disponível</span></section>
<section><div class="sectionTitle"><h2>Situação Operacional</h2><button id="editMode" hidden>Editar</button></div><div id="board" class="board"></div></section>
</main>
<dialog id="editor"><form method="dialog" id="form"><h2 id="editTitle">Editar GCIF</h2><label>Status<select id="eStatus"><option>COMBATE</option><option>MONITORAMENTO</option><option>PRONTIDÃO</option><option>BASE</option></select></label><label>Localidade<input id="eCity"></label><label>Viatura / Prefixo<input id="eVehicle"></label><label>Equipe (um militar por linha)<textarea id="eTeam" rows="7"></textarea></label><label>Observações<textarea id="eNotes" rows="3"></textarea></label><div class="actions"><button value="cancel">Cancelar</button><button id="save" value="default">Salvar</button></div></form></dialog>
<footer>Controle Operacional • Base Florestal Oeste</footer>
<script type="module" src="app.js"></script>
</body></html>
