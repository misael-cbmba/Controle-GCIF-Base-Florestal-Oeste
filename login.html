<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13251c"><title>Login administrativo — Controle GCIF</title><style>body{font-family:Arial,sans-serif;background:#eef2ef;color:#17251d;margin:0;display:grid;min-height:100vh;place-items:center}.box{background:#fff;max-width:480px;margin:24px;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0002;text-align:center}h1{font-size:24px;margin:0 0 8px}.sub{color:#526158;margin-bottom:24px}button,a{display:block;width:100%;box-sizing:border-box;border:0;border-radius:10px;padding:14px 16px;font-size:16px;font-weight:700;text-decoration:none;margin-top:12px}button{background:#0b633f;color:#fff;cursor:pointer}button:disabled{opacity:.65}a{background:#e7ece9;color:#173a2a}#msg{margin-top:18px;padding:12px;border-radius:10px;background:#f3f6f4;min-height:22px}.err{background:#fff0f0!important;color:#9a2020}</style></head><body><main class="box"><h1>Controle GCIF</h1><div class="sub">Acesso administrativo</div><p>Use sua conta Google autorizada para entrar.</p><button id="googleBtn" type="button">Entrar com Google</button><div id="msg">Aguardando login.</div><a href="./?v=105">Voltar ao aplicativo</a></main><script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script><script>const cfg={apiKey:'AIzaSyB6vG41F_gaQRk6jMMgBT-AEclDFlBWLOo',authDomain:'controle-gcif-oeste.web.app',projectId:'controle-gcif-oeste',storageBucket:'controle-gcif-oeste.firebasestorage.app',messagingSenderId:'43290614749',appId:'1:43290614749:web:16c567c1164e3c5aac3434'};firebase.initializeApp(cfg);const auth=firebase.auth(),msg=document.getElementById('msg'),btn=document.getElementById('googleBtn');function say(t,e=false){msg.textContent=t;msg.className=e?'err':''}async function finish(u){u=u||auth.currentUser;if(!u)return;say('Login realizado com '+(u.email||'conta Google')+'. Retornando ao aplicativo…');setTimeout(()=>location.replace('./?v=105'),700)}auth.onAuthStateChanged(u=>{if(u)finish(u)});btn.onclick=async()=>{say('Abrindo acesso Google…');btn.disabled=true;const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);const r=await auth.signInWithPopup(p);await finish(r.user)}catch(e){say('Falha no popup ('+(e.code||e.message)+'). Tentando redirecionamento…');try{sessionStorage.setItem('gcifLoginReturn','1');await auth.signInWithRedirect(p)}catch(r){say('Erro no login: '+(r.code||r.message),true);btn.disabled=false}}};auth.getRedirectResult().then(r=>{if(r&&r.user)finish(r.user);else if(sessionStorage.getItem('gcifLoginReturn')){sessionStorage.removeItem('gcifLoginReturn');say('Retorno do Google recebido. Verificando sessão…')}}).catch(e=>say('Erro no retorno do Google: '+(e.code||e.message),true));</script></body></html>
